apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "stardog.fullname" . }}
  namespace: {{ include "stardog.namespace" . }}
  labels:
    helm.sh/chart: {{ include "stardog.chart" . }}
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/component: server
spec:
  selector:
    matchLabels:
      app: {{ include "stardog.fullname" . }}
  serviceName: {{ include "stardog.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: {{ .Values.podManagementPolicy }}
  template:
    metadata:
      labels:
        app: {{ include "stardog.fullname" . }}
        helm.sh/chart: {{ include "stardog.chart" . }}
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/version: {{ .Chart.AppVersion }}
        app.kubernetes.io/component: server
    spec:
      {{- if .Values.serviceAccount.enabled }}
      serviceAccountName: {{ include "stardog.fullname" . }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
{{ if .Values.securityContext.enabled }}
      securityContext:
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup  }}
{{ end }}
      affinity:
        podAntiAffinity:
          {{ .Values.antiAffinity }}:
        {{- if eq .Values.antiAffinity "requiredDuringSchedulingIgnoredDuringExecution" }}
          - labelSelector:
              matchExpressions:
              - key: "app"
                operator: In
                values:
                - {{ include "stardog.fullname" . }}
            topologyKey: "kubernetes.io/hostname"
        {{- else }}
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: "app"
                  operator: In
                  values:
                  - {{ include "stardog.fullname" . }}
              topologyKey: "kubernetes.io/hostname"
        {{- end }}
      {{ if .Values.cluster.enabled }}
      initContainers:
      - name: wait-for-zk
        image: {{ .Values.busybox.image.repository }}:{{ .Values.busybox.image.tag }}
        imagePullPolicy: {{ .Values.busybox.image.pullPolicy }}
        command:
        - /bin/sh
        - -c
        - |
        {{ if .Values.zookeeper.enabled }}
          while :
          do
            echo "Checking each ZooKeeper instance to find the leader"
            
            # Normally we were checking the zk load balancer, but for some reason Minikube intermitently might get stuck
            # while resolving DNSs, returning the same IP, with no round robin. This made that some init container containers pod, will hit
            # infinitely a non-leader zk, because nc will always resolve to the same IP. Because of that, we decided to look for the leader first,
            # and hit the leader directly, without needing to hit the zk load balancer. 
            for i in 0 1 2; do
              echo "Checking {{ .Release.Name }}-zookeeper-${i}.{{ .Release.Name }}-zookeeper-headless.{{ .Release.Namespace }}.svc.cluster.local:2181"
              
              # Get status from this instance
              ZK_MNTR=$(echo mntr | nc {{ .Release.Name }}-zookeeper-${i}.{{ .Release.Name }}-zookeeper-headless.{{ .Release.Namespace }}.svc.cluster.local 2181)
              
              ZK_STATE=$(echo "${ZK_MNTR}" | grep "zk_server_state" | awk '{print $2}')
              echo "Server state: ${ZK_STATE}"
              
              if [[ "${ZK_STATE}" == "leader" ]]; then
                echo "Found leader at {{ .Release.Name }}-zookeeper-${i}"
                
                ZK_FOLLOWERS=$(echo "${ZK_MNTR}" | grep zk_synced_followers | awk '{print $2}')
                echo "Leader reports ${ZK_FOLLOWERS} synced followers"
                
                if [[ "${ZK_FOLLOWERS}" -gt "1" ]]; then
                  echo "ZK cluster is healthy with leader and ${ZK_FOLLOWERS} followers"
                  exit 0
                else
                  echo "Leader found but not enough followers are synced yet"
                fi
                
                break
              fi
            done
            
            echo "Waiting for ZooKeeper cluster to stabilize..."
            sleep 2
          done
          {{ else }}
          echo "Using existing zookeeper"
        {{ end }}
      {{ end }}
      containers:
      - name: {{ include "stardog.fullname" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        ports:
        - containerPort: {{ .Values.ports.server }}
          name: server
        {{- if .Values.ports.sql }}
        - containerPort: {{ .Values.ports.sql }}
          name: sql
        {{- end }}
        volumeMounts:
        - name: stardog-license
          mountPath: /etc/stardog-license
          readOnly: true
        - name: data
          mountPath: /var/opt/stardog/
          readOnly: false
        - name: {{ include "stardog.fullname" . }}-properties-vol
          mountPath: /etc/stardog-conf/stardog.properties
          subPath: stardog.properties
        - name: {{ include "stardog.fullname" . }}-log4j-vol
          mountPath: /var/opt/stardog/log4j2.xml
          subPath: log4j2.xml
       {{- if .Values.jwtConfig.enabled }}
        - name: {{ include "stardog.fullname" . }}-jwt
          mountPath: /var/opt/stardog/jwt.yaml
          subPath: jwt.yaml
       {{- end }}
        env:
        - name: PORT
          value: "{{ .Values.ports.server }}"
        - name: STARDOG_HOME
          value: "/var/opt/stardog/"
        - name: STARDOG_LICENSE_PATH
          value: "/etc/stardog-license/stardog-license-key.bin"
        - name: STARDOG_PROPERTIES
          value: "/etc/stardog-conf/stardog.properties"
        - name: STARDOG_SERVER_JAVA_ARGS
          value: "-XX:ActiveProcessorCount={{ .Values.resources.requests.cpu }}  -Djava.io.tmpdir={{ .Values.tmpDir }} {{ .Values.javaArgs }}"
        - name: STARDOG_PERF_JAVA_ARGS
          value: "{{ .Values.stardogPerfJavaArgs }}"
        - name: STARDOG_TMP_PATH
          value: "{{ .Values.tmpDir }}"
        - name: STARDOG_SERVER_START_ARGS
          value: "{{ .Values.serverStartArgs }}"
        resources:
{{ toYaml .Values.resources | indent 10 }}
        command:
        - /bin/bash
        - -c
        - |
          set -ex
          {{ .Files.Get "files/utils.sh" | indent 10 }}
          make_temp ${STARDOG_TMP_PATH}
          /opt/stardog/bin/stardog-admin server start --foreground --port ${PORT} --home ${STARDOG_HOME} ${STARDOG_SERVER_START_ARGS}
        startupProbe:
          httpGet:
            path: /admin/alive
            port: server
          periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.startupProbe.failureThreshold }}
        livenessProbe:
          httpGet:
            path: /admin/alive
            port: server
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
        readinessProbe:
          httpGet:
            path: /admin/healthcheck
            port: server
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
{{- if or (and .Values.image.username .Values.image.password) .Values.image.imagePullSecret (and .Values.busybox.image.username .Values.busybox.image.password) .Values.busybox.image.imagePullSecret }}
      imagePullSecrets:
  {{- if and .Values.image.username .Values.image.password }}
      - name: {{ .Release.Name }}-image-pull-secret
  {{- end}}
  {{- if .Values.image.imagePullSecret }}
      - name: {{ .Values.image.imagePullSecret }}
  {{- end}}
  {{- if and .Values.busybox.image.username .Values.busybox.image.password }}
      - name: {{ .Release.Name }}-image-busybox-pull-secret
  {{- end}}
  {{- if .Values.busybox.image.imagePullSecret }}
      - name: {{ .Values.busybox.image.imagePullSecret }}
  {{- end}}
{{- end}}
      volumes:
      - name: stardog-license
        secret:
          secretName: stardog-license
      - name: {{ include "stardog.fullname" . }}-properties-vol
        configMap:
          name: {{ include "stardog.fullname" . }}-properties
          items:
          - key: stardog.properties
            path: stardog.properties
      - name: {{ include "stardog.fullname" . }}-log4j-vol
        configMap:
          name: {{ include "stardog.fullname" . }}-log4j
          items:
          - key: log4j2.xml
            path: log4j2.xml
     {{- if .Values.jwtConfig.enabled }}
      - name: {{ include "stardog.fullname" . }}-jwt
        configMap:
          name: {{ include "stardog.fullname" . }}-jwt
          items:
            - key: jwt.yaml
              path: jwt.yaml
      {{- end }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]{{ if .Values.persistence.storageClass }}
      storageClassName: {{ .Values.persistence.storageClass }}{{ end }}
      resources:
        requests:
          storage: {{ .Values.persistence.size }}
